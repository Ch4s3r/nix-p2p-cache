[package]
name = "nix-p2p-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.56", features = ["tokio", "macros", "mdns", "quic", "request-response", "noise", "yamux", "identify", "cbor"] }
nix-base32 = "0.2"
nix-nar = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
blake3 = "1"
data-encoding = "2"
ed25519-dalek = "2"
hex = "0.4"
nix-base32 = "0.2"
nix-nar = "0.4"
reqwest = { version = "0.13", features = ["blocking"] }
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.11"
tempfile = "3"
